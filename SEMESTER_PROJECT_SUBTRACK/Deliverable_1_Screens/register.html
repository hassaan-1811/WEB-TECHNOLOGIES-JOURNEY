<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Create account | SUBTRACK
  </title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="css/style.css" rel="stylesheet"/>
 </head>
 <body>
  <main class="container py-5">
   <section class="card auth-card mx-auto">
    <div class="card-body p-4 p-md-5">
     <a class="brand fs-3" href="index.html">
      ↻ SUBTRACK.
     </a>
     <h1 class="h3 mt-4">
      A little more peace of mind.
     </h1>
     <p class="text-secondary mb-4">
      Keep every recurring bill in view.
     </p>
     <form>
      <div class="mb-3">
       <label class="form-label" for="fullname">
        Full name
       </label>
       <input autocomplete="name" class="form-control" id="fullname" name="fullname" placeholder="Your name" required=""/>
      </div>
      <div class="mb-3">
       <label class="form-label" for="email">
        Email address
       </label>
       <input autocomplete="email" class="form-control" id="email" name="email" placeholder="you@example.com" required="" type="email"/>
      </div>
      <div class="mb-3">
       <label class="form-label" for="password">
        Password
       </label>
       <input autocomplete="off" class="form-control" id="password" minlength="8" placeholder="At least 8 characters" required="" type="password"/>
      </div>
      <div class="mb-3">
       <label class="form-label" for="confirm-password">
        Confirm password
       </label>
       <input autocomplete="off" class="form-control" id="confirm-password" minlength="8" required="" type="password"/>
       
      </div>
      <button class="btn btn-success w-100" disabled="" type="button">
       Create account
      </button>
     </form>
 
     <a class="text-success small" href="login.html">
      Already have an account? Sign in
     </a>
     <hr/>
   
    </div>
   </section>
  </main>
 </body>
</html>
